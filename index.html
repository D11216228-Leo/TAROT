        }

        }

        .form-group {

        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
        }

        select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #4a5568;
            color: white;
        }

        .btn-secondary:hover {
            background: #2d3748;
        }

        .btn-reset {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-reset:hover {
            background: #cbd5e0;
        }

        #results {
            margin-top: 30px;
            display: none;
        }

        #results.show {
            display: block;
        }

            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .summary h2 {
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .cards-container {
            display: grid;
            gap: 15px;
        }

        .card-result {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s;
        }

        .card-result:hover {
            transform: translateY(-5px);

        .card-position {
            color: #667eea;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .card-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;

                <option value="3">三張牌（過去/現在/未來）</option>
            </select>
        </div>

        <div class="form-group">
            <label for="qtype">問題類型（可選）</label>
            <select id="qtype">
                <option value="">請選擇...</option>
                <option value="self">自我探索</option>
                <option value="love">感情關係</option>
                <option value="work">工作事業</option>
                <option value="study">學業成長</option>
                <option value="finance">財務狀況</option>
            </select>
        </div>

        <div class="form-group">
            <label for="question">您的問題（可留白）</label>
            <textarea id="question" placeholder="請輸入您想探索的問題..."></textarea>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="allowReversed" checked>
            <label for="allowReversed">包含逆位牌</label>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="btnDraw">🎴 抽牌</button>
            <button class="btn-secondary" id="btnRedraw">🔄 重抽</button>
            <button class="btn-reset" id="btnReset">↺ 重置</button>
        </div>

        <div id="results">
            <div class="summary">

                <p id="summaryText"></p>
            </div>
            <div class="cards-container" id="cardsContainer"></div>

        </div>
    </div>

        // ============================================
        // 牌陣定義
        // ============================================
        const SPREAD_CONFIGS = {
            1: [
                { index: 1, title: "今日建議" }
            ],
            3: [
                { index: 1, title: "過去" },
                { index: 2, title: "現在" },
                { index: 3, title: "未來" }
            ]
        };

        // ============================================
        // 工具函數
        // ============================================
        
        /**
         * 使用 crypto.getRandomValues 生成安全的隨機數
         * 使用 rejection sampling 避免 modulo bias
         * @param {number} max - 最大值（不包含），必須為正整數
         * @returns {number} 0 到 max-1 之間的隨機整數
         */
        function getSecureRandomInt(max) {
            if (!Number.isInteger(max) || max <= 0) {
                throw new Error('max must be a positive integer');
            }
            
            const array = new Uint32Array(1);
            const limit = Math.floor(0xFFFFFFFF / max) * max;
            
            do {
                crypto.getRandomValues(array);
            } while (array[0] >= limit);
            
            return array[0] % max;
        }

        /**
         * 洗牌演算法 (Fisher-Yates Shuffle)
         */
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = getSecureRandomInt(i + 1);
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        /**
         * 抽牌主函數
         */
        function drawCards(spreadCount, allowReversed) {
            const shuffled = shuffleArray(CARD_DB);
            const drawn = shuffled.slice(0, spreadCount);
            const positions = SPREAD_CONFIGS[spreadCount];
            
            return drawn.map((card, index) => {
                const isReversed = allowReversed && (getSecureRandomInt(2) === 1);
                return {
                    positionIndex: positions[index].index,
                    positionTitle: positions[index].title,
                    cardName: card.name,
                    orientation: isReversed ? 'reversed' : 'upright',
                    description: isReversed ? card.reversed : card.upright,
                    arcana: card.arcana
                };
            });
        }

        /**
         * 生成整體摘要（規則式）
         */
        function generateSummary(draws) {
            const reversedCount = draws.filter(d => d.orientation === 'reversed').length;
            const majorCount = draws.filter(d => d.arcana === 'major').length;
            const totalCount = draws.length;
            
            let summary = '';
            
            // 根據逆位數量
            if (reversedCount > 0) {
                summary += `本次抽牌出現了 ${reversedCount} 張逆位牌。逆位牌提醒您在前進之前，可能需要先進行內在調整、解決潛在問題，或是重新審視當前的方向。`;
            } else {
                summary += '本次抽牌全為正位，顯示能量流動順暢，您可以較為直接地朝目標前進。';
            }
            
            summary += ' ';
            
            // 根據大牌比例
            const majorRatio = majorCount / totalCount;
            if (majorRatio >= 0.67) {
                summary += '大阿爾克那牌比例較高，暗示此刻涉及重大的人生課題、價值觀選擇，或是命運層面的轉折。建議以更宏觀的視野看待當前狀況。';
            } else if (majorRatio >= 0.34) {
                summary += '大小阿爾克那牌平衡出現，顯示您在日常實踐與深層成長之間都有需要關注的面向。';
            } else {
                summary += '小阿爾克那牌比例較高，代表目前著重於日常事務的處理、具體行動的選擇，或是人際關係的調整。';
            }
            
            return summary;
        }

        /**
         * 顯示結果
         */
        function displayResults(draws, summary) {
            const resultsDiv = document.getElementById('results');
            const summaryText = document.getElementById('summaryText');
            const cardsContainer = document.getElementById('cardsContainer');
            
            // 顯示整體摘要
            summaryText.textContent = summary;
            
            // 清空並顯示每張牌
            cardsContainer.replaceChildren();
            draws.forEach(draw => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-result';
                
                const orientationClass = draw.orientation === 'upright' ? 'orientation-upright' : 'orientation-reversed';
                const orientationText = draw.orientation === 'upright' ? '正位' : '逆位';
                
                // 使用 DOM 操作而非 innerHTML 以避免 XSS 風險
                const positionDiv = document.createElement('div');
                positionDiv.className = 'card-position';
                positionDiv.textContent = `位置 ${draw.positionIndex}：${draw.positionTitle}`;
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'card-name';
                nameDiv.textContent = draw.cardName;
                
                const orientationSpan = document.createElement('span');
                orientationSpan.className = `card-orientation ${orientationClass}`;
                orientationSpan.textContent = orientationText;
                
                const descriptionDiv = document.createElement('div');
                descriptionDiv.className = 'card-description';
                descriptionDiv.textContent = draw.description;
                
                cardDiv.appendChild(positionDiv);
                cardDiv.appendChild(nameDiv);
                cardDiv.appendChild(orientationSpan);
                cardDiv.appendChild(descriptionDiv);
                
                cardsContainer.appendChild(cardDiv);
            });
            
            // 顯示結果區
            resultsDiv.classList.add('show');
            
            // 平滑滾動到結果區
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        /**
         * 執行抽牌
         */
        function performDraw() {
            const spreadCount = parseInt(document.getElementById('spread').value);
            const allowReversed = document.getElementById('allowReversed').checked;
            
            const draws = drawCards(spreadCount, allowReversed);
            const summary = generateSummary(draws);
            
            displayResults(draws, summary);
        }

        /**
         * 重置表單
         */
        function resetForm() {
            document.getElementById('spread').value = '1';
            document.getElementById('qtype').value = '';
            document.getElementById('question').value = '';
            document.getElementById('allowReversed').checked = true;
            document.getElementById('results').classList.remove('show');
        }

        // ============================================
        // 事件監聽器
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const btnDraw = document.getElementById('btnDraw');
            const btnRedraw = document.getElementById('btnRedraw');
            const btnReset = document.getElementById('btnReset');
            
            btnDraw.addEventListener('click', performDraw);
            btnRedraw.addEventListener('click', performDraw);
            btnReset.addEventListener('click', resetForm);
        });
    </script>
</body>
</html>
